name: Build Luker 2.7 GPT Image APK

on:
  workflow_dispatch:
  push:
    tags:
      - "apk-v2.7.0-gpt.*"

permissions:
  contents: write

env:
  APK_NAME: Luker-GPT-Image-v2.7.0-gpt.1-arm64.apk
  NODEJS_MOBILE_ASSET_URL: https://github.com/funnycups/nodejs-mobile/releases/download/v1.0.1/nodejs-mobile-android.zip
  NODEJS_MOBILE_ASSET_NAME: nodejs-mobile-android.zip
  NODEJS_MOBILE_RUNTIME_MAJOR: "24"
  NODEJS_MOBILE_MIN_MAJOR: "24"
  NODEJS_MOBILE_ENFORCE_MIN_MAJOR: "1"

jobs:
  build:
    name: Build installable APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout patch repository
        uses: actions/checkout@v4

      - name: Checkout Luker 2.7.0
        uses: actions/checkout@v4
        with:
          repository: funnycups/Luker
          ref: v2.7.0
          path: luker
          fetch-depth: 1

      - name: Apply native GPT image patch
        run: |
          git -C luker apply --check "$GITHUB_WORKSPACE/apk/luker-native-gpt-image-v2.7.0.patch"
          git -C luker apply "$GITHUB_WORKSPACE/apk/luker-native-gpt-image-v2.7.0.patch"
          test "$(node -p "require('./luker/package.json').version")" = "2.7.0-gpt.1"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: luker/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        working-directory: luker
        run: bash android-app/scripts/build-android-apk.sh release

      - name: Prepare download files
        run: |
          mkdir -p dist
          cp luker/android-app/app/build/outputs/apk/release/app-release.apk "dist/$APK_NAME"
          test -s "dist/$APK_NAME"
          unzip -t "dist/$APK_NAME"
          sha256sum "dist/$APK_NAME" | tee "dist/$APK_NAME.sha256"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Luker-GPT-Image-v2.7.0-gpt.1-arm64
          path: dist/*
          if-no-files-found: error
          retention-days: 90

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Luker GPT Image v2.7.0-gpt.1
          body: |
            Luker 2.7.0 native GPT image build for Android arm64.

            Package: com.luker.gptimage
            This APK can be installed alongside the official Luker app.
            Image generation is built in; no SillyTavern extension is required.
          files: dist/*

